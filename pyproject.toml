[project]
name = "modern-python-template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "copier==9.18.2", "pytest==9.1.1", "pyyaml==6.0.3",
    "ruff==0.16.10", "basedpyright==1.40.1",
]

[tool.uv]
package = false
required-version = ">=0.12.21,<0.13"

[tool.pytest]
testpaths = ["tests"]
strict = true
addopts = ["-ra", "--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
