name: Template
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.14'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.21'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check tests
      - run: uv run --locked ruff format --check tests
      - run: uv run --locked pytest
